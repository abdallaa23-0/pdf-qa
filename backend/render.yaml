services:
  - type: web
    name: pdf-qa-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false          # set this manually in Render dashboard
    disk:
      name: chroma-db
      mountPath: /app/chroma_db
      sizeGB: 1